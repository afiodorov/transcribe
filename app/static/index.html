<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Transcribe</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --text:#1d1d1f; --muted:#6b6b70; --line:#e3e3e0;
          --accent:#2f5d8a; --err:#a8322d; --s0:#2f5d8a; --s1:#7a4b8f; --s2:#3d7a4f; --s3:#9a6a1f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161618; --card:#202023; --text:#ececee; --muted:#9a9aa1; --line:#333338;
            --accent:#7aa7d6; --err:#e5807a; --s0:#7aa7d6; --s1:#c49ad6; --s2:#86c497; --s3:#d9b06a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .muted { color: var(--muted); font-size: .92rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:20px; margin-top:20px; }
  label { display:block; font-weight:600; margin-bottom:6px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:end; }
  .row > div { flex: 1 1 220px; }
  input[type=file], select, input[type=text] { width:100%; font:inherit; padding:8px;
          border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); }
  button { font:inherit; font-weight:600; padding:9px 16px; border-radius:8px; cursor:pointer;
           border:1px solid var(--accent); background:var(--accent); color:var(--card); }
  button.secondary { background:transparent; color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  #status { margin-top:14px; min-height:1.5em; }
  #status.err { color: var(--err); }
  progress { width:100%; height:8px; margin-top:8px; }
  #names { display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap:12px; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .seg { padding:10px 0; border-top:1px solid var(--line); }
  .seg:first-child { border-top:0; }
  .who { font-weight:700; }
  .ts { color:var(--muted); font-size:.85rem; font-variant-numeric: tabular-nums; margin-right:6px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Transcribe</h1>
  <div class="muted">Upload a recording to get a transcript with speakers labelled.
    Recordings and transcripts are not stored: once you close or reload this page, the transcript is gone, so download it first.</div>

  <form class="card" id="form">
    <div class="row">
      <div>
        <label for="file">Recording</label>
        <input type="file" id="file" accept="audio/*,video/*" required>
      </div>
      <div style="flex:0 1 250px">
        <label for="provider">Model</label>
        <select id="provider"></select>
      </div>
      <div style="flex:0 1 200px">
        <label for="language">Language</label>
        <select id="language">
          <option value="es">Spanish</option>
          <option value="en">English</option>
          <option value="de">German</option>
          <option value="fr">French</option>
          <option value="it">Italian</option>
          <option value="pt">Portuguese</option>
          <option value="nl">Dutch</option>
          <option value="ru">Russian</option>
          <option value="multi">Mixed languages</option>
        </select>
      </div>
      <div style="flex:0 0 auto"><button id="go" type="submit">Transcribe</button></div>
    </div>
    <progress id="progress" max="100" hidden></progress>
    <div id="status" class="muted"></div>
  </form>

  <section class="card" id="result" hidden>
    <label>Speaker names</label>
    <div id="names"></div>
    <div class="actions">
      <button type="button" id="docx">Download Word (.docx)</button>
      <button type="button" class="secondary" id="txt">Download text (.txt)</button>
      <button type="button" class="secondary" id="copy">Copy</button>
    </div>
    <div id="transcript" style="margin-top:16px"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let data = null, baseName = "transcript";

const ts = (s) => { s = Math.floor(s);
  return [s / 3600, (s % 3600) / 60, s % 60].map(n => String(Math.floor(n)).padStart(2, "0")).join(":"); };
const nameOf = (sp) => $("name-" + sp)?.value.trim() || `Speaker ${sp}`;
const setStatus = (msg, err = false) => { $("status").textContent = msg; $("status").className = err ? "err" : "muted"; };

let providers = [];
fetch("api/config").then(r => r.json()).then(c => {
  $("language").value = c.default_language;
  providers = c.providers;
  for (const p of providers) {
    const label = p.max_minutes ? `${p.label} (max ${p.max_minutes} min)` : p.label;
    $("provider").append(new Option(label, p.id));
  }
}).catch(() => {});

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const file = $("file").files[0];
  if (!file) return;
  baseName = file.name.replace(/\.[^.]+$/, "") || "transcript";
  const body = new FormData();
  body.append("file", file);
  body.append("language", $("language").value);
  body.append("provider", $("provider").value);

  const xhr = new XMLHttpRequest();
  xhr.open("POST", "api/transcribe");
  xhr.responseType = "json";
  $("go").disabled = true;
  $("progress").hidden = false; $("progress").value = 0;
  setStatus("Uploading…");
  xhr.upload.onprogress = (ev) => {
    if (!ev.lengthComputable) return;
    $("progress").value = 100 * ev.loaded / ev.total;
    if (ev.loaded === ev.total) { $("progress").removeAttribute("value");
      setStatus("Transcribing… a 30-minute recording takes from a few seconds to a few minutes, depending on the model."); }
  };
  xhr.onload = () => {
    $("go").disabled = false; $("progress").hidden = true;
    if (xhr.status !== 200) { setStatus(xhr.response?.detail || `Failed (${xhr.status})`, true); return; }
    data = xhr.response;
    if (!data.segments.length) { setStatus("No speech was found in this recording.", true); return; }
    const mins = data.duration ? Math.round(data.duration / 60) : "?";
    const parts = data.chunks > 1 ? ` in ${data.chunks} parts` : "";
    setStatus(`Done with ${data.provider}${parts}: ${mins} min, ${data.speakers.length} speaker(s). Rename the speakers below, then download.`
      + (data.warnings.length ? " Note: " + data.warnings.join(" ") : ""), data.warnings.length > 0);
    render();
  };
  xhr.onerror = () => { $("go").disabled = false; $("progress").hidden = true;
    setStatus("Network error; check the connection and try again.", true); };
  xhr.send(body);
});

function render() {
  $("names").innerHTML = "";
  for (const sp of data.speakers) {
    const div = document.createElement("div");
    div.innerHTML = `<input type="text" id="name-${sp}" placeholder="Speaker ${sp}" aria-label="Name for speaker ${sp}">`;
    div.querySelector("input").addEventListener("input", renderTranscript);
    $("names").append(div);
  }
  renderTranscript();
  $("result").hidden = false;
}

function renderTranscript() {
  const out = $("transcript");
  out.innerHTML = "";
  for (const s of data.segments) {
    const div = document.createElement("div");
    div.className = "seg";
    const t = document.createElement("span"); t.className = "ts"; t.textContent = s.start == null ? "" : ts(s.start);
    const w = document.createElement("span"); w.className = "who";
    w.style.color = `var(--s${s.speaker % 4})`; w.textContent = nameOf(s.speaker) + ": ";
    div.append(t, w, document.createTextNode(s.text));
    out.append(div);
  }
}

const asText = () => data.segments.map(s =>
  `${s.start == null ? "" : `[${ts(s.start)}] `}${nameOf(s.speaker)}: ${s.text}`).join("\n\n") + "\n";

function save(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

$("txt").onclick = () => save(new Blob([asText()], { type: "text/plain;charset=utf-8" }), baseName + ".txt");
$("copy").onclick = async () => { await navigator.clipboard.writeText(asText()); setStatus("Copied to clipboard."); };
$("docx").onclick = async () => {
  const names = Object.fromEntries(data.speakers.map(sp => [String(sp), nameOf(sp)]));
  const r = await fetch("api/docx", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title: baseName, names, segments: data.segments }) });
  if (!r.ok) { setStatus("Could not build the Word file.", true); return; }
  save(await r.blob(), baseName + ".docx");
};

window.addEventListener("beforeunload", (e) => { if (data) { e.preventDefault(); e.returnValue = ""; } });
</script>
</body>
</html>
